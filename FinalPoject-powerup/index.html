<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopFlow</title>
    <link rel="icon" type="image/svg+xml" href="media/logo.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="media/logo.svg" alt="ShopFlow Logo" style="width: 50px;height: 50px;"/>
        ShopFlow
      </div>
      <nav class="navContainer">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html">Products/Catalog</a></li>
          <li><a href="checkout.html">Orders</a></li>
          <li><a href="index.html?favorites=1">Favorites</a></li>
        </ul>
      </nav>
      <input id="search-input" type="text" placeholder="Search products, brands, essintials..." aria-label="Search products"/>
      <div class="headerButtons">
        <button class="darkLightToggle">Dark/Light</button>
        <button class="cartButton">Cart</button>
        <button class="ordersButton">Checkout/Orders</button>
      </div>
    </header>

    <main>
      <select name="category" id="category-select" aria-label="Category">
        <option value="all">All Categories</option>
      </select>
      <select name="sort" id="sort-select" aria-label="Sort products">
        <option value="default">Sort By: Default</option>
        <option value="priceLowToHigh">Price: Low to High</option>
        <option value="priceHighToLow">Price: High to Low</option>
      </select>
      <label><input type="checkbox" id="favorites-filter"> Favorites only</label>
      <div id="product-container"></div>
      <div id="pagination"></div>
    </main>

    <script src="javascript/common.js"></script>
    <script src="javascript/script.js"></script>
  </body>
</html>
