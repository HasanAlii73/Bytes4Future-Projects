<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - ShopFlow</title>
    <link rel="icon" type="image/svg+xml" href="media/logo.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="media/logo.svg"
          alt="ShopFlow Logo"
          style="width: 50px; height: 50px"
        />
        ShopFlow
      </div>
      <nav class="navContainer">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html">Products/Catalog</a></li>
          <li><a href="checkout.html">Orders</a></li>
        </ul>
      </nav>
      <input
        id="search-input"
        type="text"
        placeholder="Search products, brands, essentials..."
      />
      <div class="headerButtons">
        <button class="darkLightToggle" id="theme-toggle">Dark/Light</button>
        <button class="cartButton" onclick="location.href = 'cart.html'">
          Cart (<span id="cart-count">0</span>)
        </button>
        <button class="ordersButton" onclick="location.href = 'checkout.html'">
          Checkout/Orders
        </button>
      </div>
    </header>

    <main>
      <h1>Checkout</h1>
      <section id="checkout"></section>
      <section id="orders"></section>
    </main>

    <script src="javascript/common.js"></script>
    <script src="javascript/checkout.js"></script>
  </body>
</html>
