<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essence</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>Essence</header>

    <main>
      <section id="input-section">
        <label for="mood-input">How are you feeling today?</label>
        <div id="input-container">
          <input
            type="text"
            id="mood-input"
            maxlength="200"
            placeholder="e.g., happy, sad, energetic"
          />
          <button id="generate-button">Generate</button>
        </div>
        <div id="mood-chip-container">
          <button class="mood-chip" data-mood="happy">Happy</button>
          <button class="mood-chip" data-mood="anxious">Anxious</button>
          <button class="mood-chip" data-mood="calm">Calm</button>
          <button class="mood-chip" data-mood="excited">Excited</button>
          <button class="mood-chip" data-mood="angry">Angry</button>
        </div>
      </section>

      <section id="result-section"></section>
      <button id="regenerate-button" style="display: none">
        Try Another
      </button>
      <div id="mood-history"></div>
    </main>

    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
