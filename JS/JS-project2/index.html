<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHorizon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>EventHorizon</h1>
    <p>Your personal event manager.</p>
  </header>

  <main class="container">
    <section class="form-section display-none">
      <div class="form-dialog">
        <button class="close-form-btn" type="button" aria-label="Close form">&times;</button>
        <h2>Add New Event</h2>
        <form id="eventForm">
          <input type="text" id="eventTitle" placeholder="Event title" required maxlength="50">
          <input type="location" id="eventLocation" placeholder="Event location" maxlength="100">
          <input type="date" id="eventDate" required>
          <select id="eventCategory">
            <option value="home">Home</option>
            <option value="work">Work</option>
            <option value="social">Social</option>
            <option value="personal">Personal</option>
            <option value="other" selected>Other</option>
          </select>
          <button type="submit">Add Event</button>
        </form>
        <p id="formMessage" class="message"></p>
      </div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="totalTasks">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Attended</span>
        <span class="stat-value" id="attendedEvents">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Cancelled</span>
        <span class="stat-value" id="cancelledEvents">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="pendingEvents">0</span>
      </div>
    </section>

    <section class="filter-section">
      <button class="filter-btn active" data-filter="date-all">ALL</button>
      <button class="filter-btn" data-filter="date-upcoming">UPCOMING</button>
      <button class="filter-btn" data-filter="date-today">TODAY</button>
      <button class="filter-btn" data-filter="date-past">PAST</button>
    </section>

    <section class="event-list">
      <div class="event-list-header">
        <h2>My Events</h2>
        <button class="add-event-btn">Add New Event</button>
      </div>
      <div id="eventList" class="event-cards">
        <!-- Event cards will be here -->
      </div>
    </section>
  </main>

  <script src="javascript/script.js"></script>
</body>
</html>
